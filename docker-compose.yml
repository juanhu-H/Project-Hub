services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/pih-password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  backend:
    build: ./backend
    environment:
      APP_ENV: docker
      DATABASE_PATH: /data/pih.db
      CORS_ORIGINS: http://localhost:5173
      NEO4J_ENABLED: "true"
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: pih-password
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/data
    depends_on:
      - neo4j

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  neo4j_data:
  backend_data:
